name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Linux build verifies the crate is platform-portable. The fixture-compare
  # harness runs everywhere — the inputs are pre-captured from `coremlc` on
  # macOS, but our compiler is pure-Rust data transformation, so the round-
  # trip works on any OS.
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --all-targets
      - run: cargo test --release

  # macOS build is the regression gate. Anyone bumping the crate or the
  # fixtures would re-run `xcrun coremlc compile` here as the source of truth
  # for `expected-macos.mlmodelc/`. CI doesn't regenerate fixtures (that's
  # a manual + reviewed step), but it does prove our output matches the
  # committed reference on the platform that produced it.
  macos:
    name: macOS (15, pinned)
    # Pin to a specific macOS image so the bundled `coremlc` (Xcode toolchain)
    # version is reproducible. `macos-latest` rolls forward and would otherwise
    # change Apple's `buildInfo` string and any other future cosmetic output
    # without notice. See the sanity-check step below for what we tolerate.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Sanity-check coremlc availability
        run: xcrun --find coremlc
      - run: cargo build --release --all-targets
      - run: cargo test --release
      - name: Round-trip fixtures via coremlc (regression sanity check)
        # Re-run `xcrun coremlc compile` against each committed input and
        # diff against the committed reference, ignoring lines that
        # legitimately change between Apple toolchain releases:
        #
        #   - `[buildInfo = ...]` in `model.mil` carries the producer's
        #     `coremlc-component-MIL` and `coremlc-version` strings. They
        #     bump with every Xcode update and don't materially affect what
        #     watchOS does at load time (the loader is what we care about,
        #     not the producer identification).
        #
        # If anything else drifts, that's a real signal — the fixture or
        # this script needs updating, and a warning is the right response.
        run: |
          set -e
          for fx in tests/fixtures/*/; do
            input="${fx}input.mlmodel"
            [ -f "$input" ] || continue
            tmp=$(mktemp -d)
            xcrun coremlc compile "$input" "$tmp"
            stem=$(basename "$input" .mlmodel)
            committed="${fx}expected-macos.mlmodelc/model.mil"
            regenerated="$tmp/${stem}.mlmodelc/model.mil"
            # Strip the buildInfo line from both before diffing.
            stripped_committed=$(grep -v '^\[buildInfo' "$committed")
            stripped_regenerated=$(grep -v '^\[buildInfo' "$regenerated")
            if [ "$stripped_committed" != "$stripped_regenerated" ]; then
              echo "::warning::expected-macos.mlmodelc/model.mil drifted from current coremlc output for $fx (ignoring buildInfo)"
              diff <(printf '%s\n' "$stripped_committed") \
                   <(printf '%s\n' "$stripped_regenerated") || true
            fi
            rm -rf "$tmp"
          done
